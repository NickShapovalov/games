name: Охота за сиянием — проверка на истории

on:
  workflow_dispatch: {}   # запускается вручную кнопкой «Run workflow»

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Посчитать прошлые сезоны
        run: python3 .github/scripts/aurora_backtest.py aurora/backtest
      - name: Сохранить отчёт
        run: |
          git config user.name "aurora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aurora/backtest
          git diff --cached --quiet && exit 0
          git commit -m "Сияние: отчёт проверки на истории"
          git pull --rebase --autostash
          git push
