name: Охота за сиянием — обновить прогноз

on:
  schedule:
    - cron: "23 */3 * * *"   # каждые 3 часа
  workflow_dispatch: {}       # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: aurora-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать прогноз и цены
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          AURORA_DEBUG_DIR: /tmp/aurora-debug
        run: python3 .github/scripts/aurora_update.py aurora/data.json
      - name: Сохранить, если что-то изменилось
        run: |
          git config user.name "aurora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aurora/data.json
          git diff --cached --quiet && exit 0
          git commit -m "Сияние: обновлён прогноз"
          git pull --rebase --autostash
          git push
      - name: Сырые страницы расписания для отладки (ветка aurora-debug)
        if: always()
        run: |
          [ -d /tmp/aurora-debug ] || exit 0
          cd /tmp/aurora-debug
          git init -q -b aurora-debug
          git config user.name "aurora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "debug $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aurora-debug
