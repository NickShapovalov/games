<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игры Гоши</title>
<link rel="icon" href="bees/icon-192.png">
<style>
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(#5cb8ff,#d4f0ff);color:#3a2a10;display:flex;flex-direction:column;align-items:center;padding:30px 16px;box-sizing:border-box}
h1{font-size:40px;margin:10px 0 6px;text-align:center}
p{font-size:18px;margin:0 0 26px;text-align:center}
.games{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
a.game{display:block;width:240px;background:#fff;border-radius:24px;padding:18px;text-decoration:none;color:inherit;box-shadow:0 6px 18px rgba(0,0,0,.18);text-align:center;transition:transform .15s}
a.game:hover{transform:scale(1.04)}
a.game img{width:140px;height:140px;border-radius:30px}
a.game b{display:block;font-size:22px;margin:10px 0 4px}
a.game span{font-size:15px;opacity:.8}
</style>
</head>
<body>
<h1>🎮 Игры Гоши</h1>
<p>Придумал Гоша, сделали вместе с папой</p>
<div class="games">
  <a class="game" href="bees/">
    <img src="bees/icon-512.png" alt="">
    <b>Спасение мира от пчёл</b>
    <span>Лисёнок копает нору и прячется от злых пчёл с фиолетовым мёдом</span>
  </a>
</div>
</body>
</html>
